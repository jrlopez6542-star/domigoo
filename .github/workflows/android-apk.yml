name: Android APK (Preview)

on:
  pull_request:
    branches:
      - Contabilidad
    paths:
      - "apps/movil_flutter/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Flutter Android APK (Debug Signed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
          channel: stable
          cache: true

      - name: Instalar dependencias Flutter
        working-directory: apps/movil_flutter
        run: flutter pub get

      - name: Analizar código Dart (flutter analyze)
        working-directory: apps/movil_flutter
        run: flutter analyze

      - name: Ejecutar pruebas (flutter test)
        working-directory: apps/movil_flutter
        run: flutter test

      - name: Compilar APK Release (firmado con keystore debug)
        working-directory: apps/movil_flutter
        run: flutter build apk --release --dart-define=API_URL=https://domigoo.vercel.app

      - name: Verificar APK con aapt y SHA-256
        run: |
          APK_PATH="apps/movil_flutter/build/app/outputs/flutter-apk/app-release.apk"
          ls -lh "$APK_PATH"
          sha256sum "$APK_PATH"
          AAPT=$(find "${ANDROID_HOME}/build-tools" -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK_PATH" | head -n 20

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: domigoo-apk
          path: apps/movil_flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
