<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" role="img" aria-label="DOMIGOO Monocromático Blanco">
  
  <g transform="translate(12, 8) scale(0.95)">
    <!-- Estelas de velocidad -->
    <polygon points="56,50 18,54 54,59" fill="#FFFFFF"/>
    <polygon points="51,71 6,76 49,81" fill="#FFFFFF"/>
    <polygon points="46,92 20,97 44,102" fill="#FFFFFF"/>

    <!-- Letra D itálica -->
    <path d="M 62 28 L 132 28 C 176 28 198 54 188 94 C 181 120 164 134 136 140 L 146 116 C 160 110 166 96 169 82 C 173 61 159 50 130 50 L 82 50 L 66 122 L 42 128 Z" fill="#FFFFFF"/>

    <!-- Ruta turquesa -->
    <path d="M 14 166 C 58 144 106 146 146 130 C 172 119 186 98 188 76 C 194 106 178 138 142 154 C 102 172 52 166 14 166 Z" fill="#FFFFFF"/>
    <path d="M 46 158 C 78 153 108 150 136 140" fill="none" stroke="#29243E" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="7 6" opacity="0.9"/>

    <!-- Motociclista con casco y caja de reparto (silueta clara de motocicleta) -->
    <g fill="#FFFFFF">
      <!-- Caja de reparto trasera -->
      <rect x="72" y="83" width="19" height="15" rx="2.5"/>
      <rect x="71" y="81.5" width="21" height="3.5" rx="1.5"/>
      <!-- Rueda trasera y delantera (neumáticos gruesos de moto) -->
      <circle cx="93" cy="115" r="10.5"/>
      <circle cx="93" cy="115" r="3.6" fill="#29243E"/>
      <circle cx="140" cy="115" r="10.5"/>
      <circle cx="140" cy="115" r="3.6" fill="#29243E"/>
      <!-- Cuerpo de moto: motor, tanque curvo, carenado y horquilla gruesa -->
      <path d="M 86 105 L 101 99 L 116 95 C 122 90 128 90 133 95 L 138 87 L 142 89 L 135 103 L 142 115 L 136 116 L 128 106 L 118 112 L 101 112 L 87 109 Z"/>
      <!-- Asiento y guardabarros -->
      <path d="M 85 101 Q 96 95 108 98 L 120 94 L 118 90 L 92 95 Z"/>
      <!-- Conductor con casco integral -->
      <circle cx="117" cy="71" r="7.2"/>
      <path d="M 120 68 L 125.5 70.5 L 124.5 73.5 L 119 72.5 Z" fill="#29243E" opacity="0.88"/>
      <path d="M 110 78 C 103 81 99 89 102 97 L 114 97 L 119 88 L 130 89 L 132 84.5 L 119 80.5 Z"/>
      <path d="M 112 96 L 120 104 L 118 112 L 113 111 L 114 104 L 106 98 Z"/>
    </g>

    <!-- Pin de ubicación turquesa -->
    <path d="M 176 14 C 162 14 152 24 152 37 C 152 52 170 67 174 71 C 175 72 177 72 178 71 C 182 67 200 52 200 37 C 200 24 190 14 176 14 Z" fill="#FFFFFF"/>
    <circle cx="176" cy="36" r="8.5" fill="#29243E"/>
  </g>
  
  <g transform="translate(232, 108) scale(1.02)">
    <text x="0" y="0" font-family="Montserrat, 'Arial Black', Arial, sans-serif" font-size="68" font-weight="800" font-style="italic" letter-spacing="-1">
      <tspan fill="#FFFFFF">DOMI</tspan><tspan fill="#FFFFFF">GOO</tspan>
    </text>
    <polygon points="2,18 42,16.5 42,19.5" fill="#FFFFFF"/>
    <text x="182" y="23" text-anchor="middle" font-family="Montserrat, Inter, Arial, sans-serif" font-size="13.5" font-weight="700" letter-spacing="3.2" fill="#FFFFFF">TU CIUDAD A TU PUERTA</text>
    <polygon points="362,18 322,16.5 322,19.5" fill="#FFFFFF"/>
  </g>
</svg>
